# CI gate for pull requests and pushes (spec §13.5):
# npm ci → check → unit tests → validate:data → build → file count/size gate → e2e (Playwright)
name: ci

on:
  pull_request:
  push:
    branches: [main, master]
    paths-ignore:
      - 'public/data/v1/**' # data-only commits from the ETL bot are validated by the ETL job itself
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type-check (astro check + tsc)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Validate published data (self-check)
        run: npm run validate:data

      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
        run: npm run build

      - name: Output gates (Cloudflare Pages limits: 20,000 files, 25 MiB per file)
        run: |
          COUNT=$(find dist -type f | wc -l)
          echo "files: $COUNT"
          test "$COUNT" -lt 18000
          BIG=$(find dist -type f -size +20M | head -5)
          if [ -n "$BIG" ]; then echo "files over 20 MiB:"; echo "$BIG"; exit 1; fi
          JS=$(du -cb dist/_astro/*.js | tail -1 | cut -f1)
          echo "raw JS bytes: $JS"

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
